spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testtask
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    location: classpath:db/migration
  application:
    name: testtask
vaadin:
  launch-browser: true
server:
  port: 8080
