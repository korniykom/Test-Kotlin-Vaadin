spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testtask
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: testtask
vaadin:
  launch-browser: true
server:
  port: 8080
