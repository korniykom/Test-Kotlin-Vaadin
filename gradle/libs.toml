[versions]
kotlin = "2.3.20"
spring-boot = "4.0.5"
spring-dependency-management = "1.1.7"
vaadin = "25.1.5"
karibu-dsl = "2.1.1"

[libraries]
vaadin-bom = { module = "com.vaadin:vaadin-bom", version.ref = "vaadin" }
vaadin-dev = { module = "com.vaadin:vaadin-dev" }
vaadin-springboot-starter = { module = "com.vaadin:vaadin-spring-boot-starter" }

kotlin-refrect = {module = "org.jetbrains.kotlin:kotlin-reflect" }

karibu-dsl = { module = "com.github.mvysny.karibudsl:karibu-dsl", version.ref = "karibu-dsl"}


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
kotlin-spring = { id  = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin"}
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin"}
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot"}
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management"}
vaadin = { id = "com.vaadin", version.ref = "vaadin"}

